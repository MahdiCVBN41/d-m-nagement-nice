<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet">
  <!-- Fond dégradé bleu (cohérent avec le theme du site #1e40af / #1e3a8a) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Camion stylisé -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="380" height="160" rx="12" fill="#1e40af" stroke="#3b82f6" stroke-width="3"/>
    <rect x="390" y="-20" width="160" height="180" rx="12" fill="#3b82f6"/>
    <rect x="410" y="10" width="120" height="60" rx="6" fill="#dbeafe"/>
    <text x="470" y="55" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1e40af" text-anchor="middle">N</text>
    <rect x="20" y="30" width="340" height="28" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="20" y="75" width="340" height="28" rx="3" fill="#fff" opacity="0.15"/>
    <rect x="20" y="120" width="340" height="28" rx="3" fill="#fff" opacity="0.15"/>
    <circle cx="100" cy="180" r="30" fill="#1f2937"/>
    <circle cx="100" cy="180" r="15" fill="#9ca3af"/>
    <circle cx="320" cy="180" r="30" fill="#1f2937"/>
    <circle cx="320" cy="180" r="15" fill="#9ca3af"/>
    <circle cx="475" cy="180" r="30" fill="#1f2937"/>
    <circle cx="475" cy="180" r="15" fill="#9ca3af"/>
  </g>

  <!-- Texte principal -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="600" fill="#fbbf24">NICE DÉMÉNAGEMENT</text>

  <text x="80" y="200" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">Déménageur professionnel</text>
  <text x="80" y="270" font-family="Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">à Nice &amp; en France</text>

  <!-- Badges -->
  <g transform="translate(80, 540)">
    <rect x="0" y="0" width="220" height="56" rx="28" fill="rgba(255,255,255,0.1)" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fbbf24" text-anchor="middle">★ 98% satisfaits</text>

    <rect x="240" y="0" width="200" height="56" rx="28" fill="rgba(255,255,255,0.1)" stroke="#fff" stroke-width="2"/>
    <text x="340" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">10+ ans d'expérience</text>

    <rect x="460" y="0" width="220" height="56" rx="28" fill="rgba(255,255,255,0.1)" stroke="#fff" stroke-width="2"/>
    <text x="570" y="36" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Devis gratuit 24h</text>
  </g>

  <!-- URL en bas à droite -->
  <text x="1120" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e0" text-anchor="end">www.nice-demenagement.fr</text>
